name: Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize providers without state
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color
      - name: Test deployment guards
        run: python3 -m unittest discover -s tests -p test_deployment_guards.py -v
