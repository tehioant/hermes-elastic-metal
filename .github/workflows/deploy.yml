name: Deploy infrastructure and host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Exchange a main/production OIDC token for a short-lived Tailscale node.

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      EXPECTED_STATE_LINEAGE: ${{ vars.EXPECTED_STATE_LINEAGE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS_JSON }}
      TF_VAR_domain_owner: ${{ secrets.DOMAIN_OWNER_JSON }}
      TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
      TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
      TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Check deployment configuration
        shell: bash
        env:
          SSH_DEPLOY_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STATE_BUCKET EXPECTED_STATE_LINEAGE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID SCW_DEFAULT_ORGANIZATION_ID TF_VAR_ssh_public_key TF_VAR_admin_cidrs TF_VAR_domain_owner TS_CLIENT_ID TS_AUDIENCE TAILSCALE_HOST SSH_DEPLOY_PRIVATE_KEY SSH_KNOWN_HOSTS RESTIC_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              printf '::error::Missing production environment setting: %s\n' "$name"
              exit 1
            fi
          done
          [[ "${TAILSCALE_HOST}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Invalid TAILSCALE_HOST'; exit 1; }
      - name: Connect to the private deployment network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_HOST }}
      - name: Verify pinned host key and deploy access
        shell: bash
        env:
          SSH_DEPLOY_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$TAILSCALE_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" >/dev/null
          printf 'Host %s\n  IdentityFile %s/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 15\n' "$TAILSCALE_HOST" "$HOME" > "$HOME/.ssh/config"
          ssh "ops@${TAILSCALE_HOST}" 'sudo -n true'
      - name: Apply verified plan against migrated state
        shell: bash
        run: |
          set -euo pipefail
          plan_path="${RUNNER_TEMP}/terraform.tfplan"
          trap 'rm -f "$plan_path"' EXIT
          terraform -chdir=terraform init -input=false -backend-config="bucket=${STATE_BUCKET}" -no-color
          terraform -chdir=terraform state pull | python3 scripts/deployment_guards.py state
          terraform -chdir=terraform plan -input=false -lock-timeout=10m -no-color -out="$plan_path"
          terraform -chdir=terraform show -json "$plan_path" | python3 scripts/deployment_guards.py plan
          terraform -chdir=terraform apply -input=false -lock-timeout=10m -no-color "$plan_path"
      - name: Ship host configuration and verify services
        shell: bash
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/ship.sh "ops@${TAILSCALE_HOST}"
          ssh "ops@${TAILSCALE_HOST}" 'sudo -n systemctl is-active --quiet docker.service restic-backup.timer healthcheck.timer'
