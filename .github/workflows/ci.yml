name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-26.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: terraform
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize
        run: terraform -chdir=terraform init -input=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color
      - name: Plan
        run: terraform -chdir=terraform plan -input=false -no-color -lock-timeout=10m
      - name: Test firewall reconciliation
        run: python3 -m unittest discover -s tests -p test_firewall.py -v
