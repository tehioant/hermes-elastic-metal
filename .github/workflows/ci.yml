name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/firewall.sh"
      - "tests/**"
      - "!tests/test_security_dashboard*.py"
      - "!tests/security_dashboard_smoke.py"
      - "!tests/test_netdata_grafana.py"
      - "!tests/netdata_grafana_smoke.py"
      - "!tests/*security_watch*.py"
      - "!tests/test_wazuh*.py"
      - "!tests/*suricata*.py"
      - ".mise.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-26.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: terraform
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize
        run: terraform -chdir=terraform init -input=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color
      - name: Test portfolio DNS without live resources
        run: terraform -chdir=terraform test -no-color -filter=tests/portfolio_dns.tftest.hcl
      - name: Plan
        run: terraform -chdir=terraform plan -input=false -no-color -lock-timeout=10m
      - name: Install configuration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml python3-bcrypt
      - name: Test infrastructure configuration
        run: PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
