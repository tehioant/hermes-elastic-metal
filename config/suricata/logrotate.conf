/var/log/hermes-suricata/eve.json /var/log/hermes-suricata/suricata.log {
    size 50M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 hermes-suricata hermes-suricata
    su hermes-suricata hermes-suricata
    sharedscripts
    prerotate
        set -eu
        test ! -L /var/lib/hermes-suricata
        test "$(/usr/bin/stat -c '%u:%a' /var/lib/hermes-suricata)" = "0:750"
        pending=/var/lib/hermes-suricata/rotation-active
        test ! -e "$pending" && test ! -L "$pending"
        sensor=0; filter=0
        if /bin/systemctl is-active --quiet hermes-suricata.service; then sensor=1; fi
        if /bin/systemctl is-active --quiet hermes-suricata-alerts.service; then filter=1; fi
        umask 027
        printf '%s %s\n' "$sensor" "$filter" > "$pending"
        /bin/systemctl stop hermes-suricata-alerts.service
        /bin/systemctl stop hermes-suricata.service
        # Blocking stop has closed the writer FD. Never compress an unread prior inode.
        /usr/bin/python3 -c '
import json, os
from pathlib import Path
source = Path("/var/log/hermes-suricata/eve.json")
state = Path("/var/lib/hermes-suricata/filter/filter.json")
proof = Path("/var/lib/hermes-suricata/rotation.json")
if source.exists():
    stat = source.stat()
    if state.exists():
        saved = json.loads(state.read_text())
        if (saved.get("device"), saved.get("inode")) != (stat.st_dev, stat.st_ino):
            raise SystemExit("rotation refused: filter must drain previous EVE inode first; services remain stopped")
    temporary = proof.with_suffix(".tmp")
    temporary.write_text(json.dumps({"device": stat.st_dev, "inode": stat.st_ino}))
    os.chmod(temporary, 0o640)
'
        if test -f /var/lib/hermes-suricata/rotation.tmp; then
            /bin/chown root:hermes-suricata /var/lib/hermes-suricata/rotation.tmp
            /bin/mv /var/lib/hermes-suricata/rotation.tmp /var/lib/hermes-suricata/rotation.json
        fi
    endscript
    postrotate
        set -eu
        pending=/var/lib/hermes-suricata/rotation-active
        read -r sensor filter < "$pending"
        # If only suricata.log rotated, EVE's inode may be written again: revoke its witness.
        /usr/bin/python3 -c '
import json
from pathlib import Path
source = Path("/var/log/hermes-suricata/eve.json")
proof = Path("/var/lib/hermes-suricata/rotation.json")
if source.exists() and proof.exists():
    stat = source.stat()
    saved = json.loads(proof.read_text())
    if (saved.get("device"), saved.get("inode")) == (stat.st_dev, stat.st_ino):
        proof.unlink()
'
        if test "$sensor" = 1; then /bin/systemctl start hermes-suricata.service; fi
        if test "$filter" = 1; then /bin/systemctl start hermes-suricata-alerts.service; fi
        /bin/rm "$pending"
    endscript
}
