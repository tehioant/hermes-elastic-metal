# Google login in front of Netdata (Caddy forward_auth). Secrets and FQDN-derived
# values come from /etc/oauth2-proxy/netdata.env, written by install-oauth2-proxy.sh.
provider = "google"
http_address = "127.0.0.1:4180"
reverse_proxy = true
upstreams = ["static://202"]
email_domains = ["*"]
cookie_name = "_netdata_oauth2"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "12h"
set_xauthrequest = true
skip_provider_button = true
