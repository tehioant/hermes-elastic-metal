[server]
http_addr = 127.0.0.1
http_port = 3001
domain = localhost
root_url = http://localhost:3001/
serve_from_sub_path = false

[paths]
data = /var/lib/hermes-security-dashboard/grafana
logs = /var/log/hermes-security-dashboard/grafana
provisioning = /etc/hermes-security-dashboard/provisioning

[security]
admin_user = admin
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD} ; betterleaks:allow (environment reference, not a literal credential)
secret_key = $__env{GF_SECURITY_SECRET_KEY}

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[metrics]
enabled = false
